name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Syntax check
        run: bash -n fetch.sh open.sh tests/run.sh tests/bin/gh tests/open-bin/*

      - name: Shellcheck
        run: shellcheck -S error fetch.sh open.sh tests/run.sh tests/bin/gh tests/open-bin/*

      - name: Manifest sanity
        run: |
          jq -e '.schemaVersion and .id and .name and .version
                 and (.kinds | index("bar-widget"))
                 and .entryPoints.barWidget
                 and (.barWidget.schema | map(.key) | length == (unique | length))' manifest.json

      - name: Tests
        run: tests/run.sh
